<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ — たすく（Tasuku）</title>
<meta name="description" content="AI秘書サービス「たすく（Tasuku）」へのお問い合わせページです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1a1a1a;--paper:#f6f3ed;--cream:#ece7db;--accent:#c4532a;
  --accent-light:#e8704a;--sage:#5a7a64;--sage-light:#e8efe9;
  --muted:#8a8478;--border:#d4cfc5;
  --serif:'Instrument Serif',serif;--mincho:'Shippori Mincho',serif;
  --gothic:'Zen Kaku Gothic New',sans-serif;--mono:'DM Mono',monospace;
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--gothic);color:var(--ink);background:var(--paper);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:256px 256px}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px clamp(24px,5vw,80px);display:flex;justify-content:space-between;align-items:center;background:rgba(246,243,237,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mincho);font-size:1.35rem;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.nav-logo span{font-size:1.5rem}
.nav-back{font-family:var(--gothic);font-size:.8rem;font-weight:500;color:var(--muted);text-decoration:none}
.nav-back:hover{color:var(--ink)}

.contact-page{max-width:720px;margin:0 auto;padding:120px clamp(24px,5vw,48px) 80px;text-align:center}
.contact-page h1{font-family:var(--mincho);font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;margin-bottom:8px;line-height:1.3}
.contact-page .subtitle{font-family:var(--serif);font-size:1.1rem;color:var(--muted);font-style:italic;margin-bottom:32px}
.contact-page .desc{font-size:.95rem;color:var(--muted);line-height:1.9;margin-bottom:40px}
.form-wrapper{background:var(--cream);border:1px solid var(--border);padding:4px;margin-bottom:40px}
.form-wrapper iframe{width:100%;height:800px;border:none;background:#fff}
.contact-alt{font-size:.9rem;color:var(--muted);line-height:1.8}
.contact-alt strong{color:var(--ink)}

footer{padding:48px clamp(24px,5vw,80px);border-top:1px solid var(--border)}
footer .f-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.footer-brand{font-family:var(--mincho);font-weight:500}
.footer-meta{font-size:.75rem;color:var(--muted);display:flex;gap:24px}
.footer-meta a{color:var(--muted);text-decoration:none}
.footer-meta a:hover{color:var(--ink)}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><span>📎</span> たすく</a>
  <a href="index.html" class="nav-back">← トップへ戻る</a>
</nav>

<main class="contact-page">
<h1>お問い合わせ</h1>
<div class="subtitle">Contact Us</div>
<p class="desc">
  サービスに関するご質問・ご要望・導入のご相談など、<br>
  お気軽にお問い合わせください。通常2営業日以内にご返信いたします。
</p>

<div class="form-wrapper">
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSf15O4R-dDpbyBuw1RTuokzY0lZ30pwNdBrPKolRtn5zII/viewform?embedded=true" title="お問い合わせフォーム">
    読み込み中...
  </iframe>
</div>

<div class="contact-alt">
  <p>フォームが表示されない場合は、直接メールでもお問い合わせいただけます。</p>
  <p><strong>[info@teraren.com]</strong></p>
</div>
</main>

<footer>
  <div class="f-inner">
    <div class="footer-brand">📎 たすく — by 合同会社テラレン</div>
    <div class="footer-meta">
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="contact.html">お問い合わせ</a>
      <span>© 2026 Teraren LLC</span>
    </div>
  </div>
</footer>

</body>
</html>
